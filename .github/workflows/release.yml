name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: write
jobs:
  release:
    # arm64, so release-files.sh can run the bundle's own sidegated and read what it says.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # One tag's run at a time, so each decides Latest against what is already published.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # A malformed tag, or one already published, stops here, before anything is built.
      - name: The tag is a new release version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: scripts/release-latest.sh "$TAG" >/dev/null
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the bundle and the release files
        env:
          RELEASES: ${{ github.server_url }}/${{ github.repository }}/releases
        run: |
          bundle=$(scripts/build-bundle.sh "$GITHUB_REF_NAME" "$RELEASES")
          scripts/release-files.sh "$GITHUB_REF_NAME" "$RELEASES" "$bundle" dist/release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A run that failed after creating its draft left it behind; Re-run starts clean.
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --draft --verify-tag --title "$TAG" \
            --notes-file dist/release/NOTES.md dist/release/files/*
          latest=$(scripts/release-latest.sh "$TAG")
          gh release edit "$TAG" --draft=false --latest="$latest"
