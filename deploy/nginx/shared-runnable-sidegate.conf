# The page behind the UniFi login. The installer places this as
# /data/unifi-core/config/http/shared-runnable-sidegate.conf, where
# shared-server-defaults.conf includes it inside UniFi's own server block.
#
# @AUTH_INCLUDE@ is the auth include line of the generated network file beside it, read at
# install time rather than assumed, so the login is whatever UniFi's own apps use.
# @PROOF@ is the installer's random proof, so the installed file is root's alone: nginx's
# master reads it, and nginx's workers and anyone else on the gateway can't. @AUTH_HEADER@,
# @PROOF_HEADER@ and @SOCKET@ are the daemon's own names for them, and @PAGE@ is its base path
# without the last slash.
location = @PAGE@ {
    return 302 @PAGE@/;
}

location ^~ @PAGE@/ {
    @AUTH_INCLUDE@

    # The daemon reads these two and nothing else as proof of login. Setting them replaces
    # whatever the browser sent, and they are sent only when proxying, after the access
    # phase's auth subrequest passed. The auth header is that subrequest's upstream status
    # and cache status, which is non-empty whenever it passed: both when it asked UniFi's
    # login, the cache status alone when UniFi's 10 s auth cache answered and no upstream
    # ran. If no subrequest ran, nothing sets it, so nginx sends no auth header and the
    # daemon answers 401: a changed auth contract closes the page instead of opening it.
    auth_request_set $sidegate_auth "$upstream_status$upstream_cache_status";
    proxy_set_header @AUTH_HEADER@ $sidegate_auth;
    proxy_set_header @PROOF_HEADER@ "@PROOF@";

    # No browser credential goes further: UniFi's login checked the cookie and its own CSRF
    # token, X-Csrf-Token, and the daemon's own CSRF token in its own header guards writes.
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Csrf-Token "";
    proxy_set_header Host $host;

    # A quiet gateway sends nothing on api/events, so the stream can sit silent for days.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1d;
    proxy_send_timeout 1m;

    client_max_body_size 1m;
    proxy_pass http://unix:@SOCKET@;
}
