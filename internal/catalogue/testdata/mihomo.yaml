mixed-port: 7890
allow-lan: false
mode: rule
dns:
  enable: true
  nameserver: [1.1.1.1]
anchors:
  reality: &reality
    public-key: 3NuZ1PLjlXLb5AIckuT9Kp29mgcviSltCd3VwZvMh58
    short-id: 13f0a742ae772601
proxies:
  - name: "🇩🇪 DE Reality"
    type: vless
    server: de.mihomo.example.net
    port: 443
    uuid: c3c3c3c3-0000-4000-8000-000000000001
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.example.com
    client-fingerprint: chrome
    reality-opts: *reality
  - name: "🇳🇱 NL VMess WS"
    type: vmess
    server: nl.mihomo.example.net
    port: 443
    uuid: c3c3c3c3-0000-4000-8000-000000000002
    alterId: 0
    cipher: auto
    tls: true
    servername: nl.mihomo.example.net
    network: ws
    ws-opts:
      path: /vmws
      headers:
        Host: nl.mihomo.example.net
  - name: "🇫🇮 FI Trojan gRPC"
    type: trojan
    server: fi.mihomo.example.net
    port: "443"
    password: miTrojan
    sni: fi.mihomo.example.net
    network: grpc
    grpc-opts:
      grpc-service-name: trgrpc
    smux:
      enabled: true
  - name: "SS 2022"
    type: ss
    server: ss.mihomo.example.net
    port: 8388
    cipher: 2022-blake3-aes-256-gcm
    password: "gLdS2A+iV4ANNEeaWlkt0A=="
  - name: "SS obfs"
    type: ss
    server: ss.mihomo.example.net
    port: 8389
    cipher: aes-128-gcm
    password: miObfs
    plugin: obfs
    plugin-opts: {mode: tls, host: example.com}
  - name: "Hy2"
    type: hysteria2
    server: hy.mihomo.example.net
    port: 443
    password: miHy2
  - name: "TUIC"
    type: tuic
    server: tuic.mihomo.example.net
    port: 443
    uuid: c3c3c3c3-0000-4000-8000-000000000003
    password: miTuic
  - name: "Relay SOCKS"
    type: socks5
    server: relay.mihomo.example.net
    port: 1080
    username: relayUser
    password: relayPass
  - name: "🇺🇸 US via relay"
    type: vless
    server: us.mihomo.example.net
    port: 443
    uuid: c3c3c3c3-0000-4000-8000-000000000004
    tls: true
    servername: us.mihomo.example.net
    skip-cert-verify: true
    fingerprint: "39:1d:f8:c9:2c:99:ed:ba:0c:c2:d8:a9:0c:53:3a:9e:3e:f6:9e:7c:be:6e:6a:6a:da:f1:fc:fc:92:ed:5d:7d"
    network: ws
    ws-opts: {path: /us}
    dialer-proxy: "Relay SOCKS"
  - name: "Via group"
    type: vless
    server: grp.mihomo.example.net
    port: 443
    uuid: c3c3c3c3-0000-4000-8000-000000000005
    dialer-proxy: Auto
proxy-groups:
  - name: Auto
    type: url-test
    proxies: ["🇩🇪 DE Reality", "🇳🇱 NL VMess WS"]
    url: https://www.gstatic.com/generate_204
    interval: 300
rules:
  - MATCH,Auto
